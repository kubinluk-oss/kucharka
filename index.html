<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kuchařka</title>
<meta name="description" content="Sdílená sbírka receptů">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- Stavový řádek ZÁMĚRNĚ neprůhledný (žádné black-translucent): iOS 26.1+ u průsvitného
     přes horní okraj appky na ploše kreslí rozmazání, které z webu nejde vypnout.
     Takhle appka začíná pod časem/baterií a řádek se obarví podle theme-color. -->
<meta name="apple-mobile-web-app-title" content="Kuchařka">
<meta name="theme-color" content="#FAF6EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16120E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="offline-banner" class="offline-banner" hidden>Jste offline. Změny se projeví po obnovení připojení.</div>

<!-- Horní navigace (desktop) -->
<header class="topnav" id="topnav">
  <a class="wordmark" href="#/">Kuchařka<span>.</span></a>
  <nav class="topnav-links">
    <span class="topnav-indicator" id="topnav-indicator" aria-hidden="true"></span>
    <a href="#/" id="nav-home" data-tab="home">Domů</a>
    <a href="#/kategorie" id="nav-cats" data-tab="cats">Kategorie</a>
    <a href="#/nakup" id="nav-shopping" data-tab="shopping">Nákupní seznam</a>
    <a href="#/hledat" id="nav-search" data-tab="search">Hledat</a>
  </nav>
  <div class="topnav-right">
    <a class="topnav-add" id="nav-add" href="#/novy"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>Nový recept</a>
    <button class="profile-btn profile-avatar-btn" id="profile-btn-desktop" aria-label="Profil a nastavení"></button>
  </div>
</header>

<!-- Náhled sdíleného receptu bez přihlášení: horní lišta s výzvou k odemčení celé kuchařky -->
<div id="public-banner" class="public-banner" hidden>
  <span>Kuchařka je jinak zamčená</span>
  <button id="public-login-btn">Zobrazit celou kuchařku</button>
</div>

<!-- Navigační lišta (mobil): sklo + malý nadpis, když velký nadpis odjede (viz updateNavbar) -->
<div class="navbar" id="navbar" aria-hidden="true"><span class="navbar-title" id="navbar-title"></span></div>

<main id="view"></main>
<footer class="site-footer">Kuchařka · vyrobeno s láskou a hladem</footer>

<!-- Plovoucí tab bar (mobil) — vzor YouTube iOS: 5 položek, jen piktogramy bez
     popisků, uprostřed „+" (přidat recept). Vybraná záložka má tmavší skleněnou
     kapsli (.tab-indicator), „+" je akce bez zvýraznění. -->
<div class="tabbar-wrap" id="tabbar-wrap">
  <nav class="tabbar" id="tabbar">
    <span class="tab-indicator" id="tab-indicator" aria-hidden="true"></span>
    <a href="#/" data-tab="home" id="tab-home" aria-label="Domů">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1H10v-5.5a2 2 0 0 1 4 0V21h3.5a1 1 0 0 0 1-1V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a href="#/kategorie" data-tab="cats" id="tab-cats" aria-label="Kategorie">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2.2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2.2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2.2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </a>
    <a href="#/novy" data-tab="add" id="tab-add" aria-label="Nový recept">
      <svg viewBox="0 0 24 24"><line x1="12" y1="4.5" x2="12" y2="19.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><line x1="4.5" y1="12" x2="19.5" y2="12" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
    </a>
    <a href="#/nakup" data-tab="shopping" id="tab-shopping" aria-label="Nákupní seznam">
      <svg viewBox="0 0 24 24"><path d="M7 8V6.5a5 5 0 0 1 10 0V8m-13.2 0h16.4l-.9 11.4a1.8 1.8 0 0 1-1.8 1.6H6.5a1.8 1.8 0 0 1-1.8-1.6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a href="#/hledat" data-tab="search" id="tab-search" aria-label="Hledat">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16" y1="16" x2="20.5" y2="20.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </a>
  </nav>
</div>

<div id="sheet-root"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<div id="loader" class="loader-backdrop" hidden>
  <div class="loader-box"><div class="spinner"></div><div class="loader-label" id="loader-label">Načítám…</div></div>
</div>

<!-- Přihlašovací brána: dokud tu něco je, appka za ní je skrytá -->
<div id="auth-gate" class="auth-gate" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
